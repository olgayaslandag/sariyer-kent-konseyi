services:
  web:
    build:
      context: .
      args:
        # Build-time SITE_URL passthrough (Dockerfile ARG SITE_URL).
        # Örn: SITE_URL=https://ornek.com docker compose up --build
        # Boşsa config.js varsayılan prod URL fallback'i kullanılır.
        SITE_URL: ${SITE_URL:-}
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
